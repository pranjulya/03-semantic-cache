name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install dependencies
        run: uv sync --frozen
      # Smoke tests need cached models and a live local Ollama, so CI runs the offline suite.
      - name: Run tests
        run: uv run --frozen pytest -q -m "not smoke"
